{% load static %}<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}TrackVault{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/trackvault.css' %}">
</head>
<body>
    <header class="tv-header">
        <a href="{% url 'core:home' %}" class="tv-logo">TrackVault</a>
        <form method="get" action="{% url 'acervo:faixa_lista' %}" class="tv-busca-rapida" role="search">
            <input type="search" name="q" placeholder="Buscar faixa, artista ou álbum" aria-label="Buscar" maxlength="100">
        </form>
        <nav>
            <a href="{% url 'acervo:faixa_lista' %}">Faixas</a>
            <a href="{% url 'acervo:album_lista' %}">Álbuns</a>
            <a href="{% url 'acervo:colecao_lista' %}">Coleções</a>
            {% if user.is_authenticated %}
                <span class="tv-muted">{{ user.username }}</span>
                <form method="post" action="{% url 'accounts:logout' %}" class="tv-inline">
                    {% csrf_token %}
                    <button type="submit" class="tv-link">Sair</button>
                </form>
            {% else %}
                <a href="{% url 'accounts:login' %}">Entrar</a>
                <a href="{% url 'accounts:cadastro' %}">Criar conta</a>
            {% endif %}
        </nav>
    </header>

    <main>
        {% for message in messages %}
            <div class="tv-alert tv-alert-{{ message.tags }}" role="alert">{{ message }}</div>
        {% endfor %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
